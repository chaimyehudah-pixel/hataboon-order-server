<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הטאבון</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#111;color:white;text-align:center;padding:14px;font-size:20px}

.topCart{position:sticky;top:0;z-index:50;background:white;border-bottom:1px solid #ddd;padding:10px;display:flex;gap:10px;justify-content:center;align-items:center;font-size:20px;font-weight:bold}
.topCart button{background:#159947;color:white;border:0;border-radius:8px;padding:10px 20px;font-size:18px;cursor:pointer}

.layout{display:flex;height:calc(100vh - 58px)}
.side{width:220px;background:#e9e9e9;padding:10px;overflow:auto}
.side button{width:100%;padding:12px;margin-bottom:8px;border:1px solid #ccc;background:white;cursor:pointer;font-weight:bold}

.main{flex:1;padding:20px;overflow:auto}
.grid{display:flex;flex-wrap:wrap;gap:12px}

.box{width:170px;background:white;border:1px solid #ccc;border-radius:6px;text-align:center;padding:10px;cursor:pointer}
.box:hover{background:#f9f9f9}

.cat{font-weight:bold}
.price{margin-top:5px}

.panel{background:white;padding:20px;border-radius:8px;border:1px solid #ddd;max-width:980px}

.extraRow{display:grid;grid-template-columns:130px 1fr 150px;align-items:center;border:1px solid #ddd;margin-bottom:8px;padding:8px;background:#fafafa}
.extraName{font-weight:bold}

.circle{width:82px;height:82px;border-radius:50%;overflow:hidden;display:grid;border:1px solid #aaa;background:white}
.q{border:1px solid #eee;cursor:pointer}
.q.on{background:#d71920}

.checkBox{width:35px;height:35px;border:2px solid #aaa;cursor:pointer}
.checkBox.on{background:#d71920}

.qtyBox{display:flex;align-items:center;justify-content:center;gap:8px}
.qtyBtn{width:32px;height:32px;border:0;border-radius:50%;background:#111;color:white;font-size:20px;cursor:pointer}
.qtyNum{min-width:28px;text-align:center;font-weight:bold;font-size:18px}

.selected{outline:3px solid green}

.backBtn{margin-bottom:10px;padding:8px 14px;cursor:pointer}
.freeText{font-weight:bold;color:green;margin:10px 0;font-size:18px}

.addBtn,.payBtn,.confirmBtn{margin-top:15px;padding:12px 25px;background:#159947;color:white;border:0;border-radius:6px;cursor:pointer;font-size:17px}
.payBtn{width:100%;font-size:22px}

.optionBtn{padding:16px 28px;margin:8px;border:1px solid #ccc;background:#fff;border-radius:8px;cursor:pointer;font-size:20px}
.optionBtn.on{background:#159947;color:white}

.formRow{margin-bottom:12px}
.formRow label{display:block;font-weight:bold;margin-bottom:5px}
.formRow input,.formRow textarea{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:6px}

.cart{margin-top:20px;background:white;border:1px solid #ccc;padding:12px;border-radius:8px}
.cartTitle{margin:0 0 10px 0;font-size:24px}
.cartTotal{font-size:20px;font-weight:bold;color:#159947;margin-top:10px}
.cartLine{border-bottom:1px solid #ddd;padding:8px}
.deleteBtn{background:#d71920;color:white;border:0;border-radius:5px;padding:5px 10px;cursor:pointer;margin-top:6px}

.loading{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;z-index:9999;font-size:22px;font-weight:bold}
.spinner{width:45px;height:45px;border:5px solid #ddd;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;margin-left:12px}
@keyframes spin{to{transform:rotate(360deg)}}

.msgOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10000;padding:18px}
.msgBox{background:white;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:420px;width:100%;padding:24px;text-align:center;border:1px solid #ddd}
.msgText{font-size:22px;font-weight:bold;line-height:1.5;margin-bottom:18px;color:#111}
.msgBtn{background:#9b4d36;color:white;border:0;border-radius:999px;padding:12px 28px;font-size:18px;cursor:pointer}

.infoBox{background:#f7f7f7;border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;line-height:1.8}
.deliveryBadge{background:#f7f7f7;border:1px solid #ddd;border-radius:999px;padding:7px 14px;font-size:16px;font-weight:bold}
.recommendBox{background:#fff8e8;border:1px solid #e5c77b;border-radius:10px;padding:12px;margin:12px 0;line-height:1.7}
.recommendTitle{font-size:18px;font-weight:bold;margin-bottom:8px;color:#5b3b00}
.recommendItems{display:flex;flex-wrap:wrap;gap:8px}
.recommendBtn{background:white;border:1px solid #d8b25a;border-radius:999px;padding:8px 12px;font-size:16px;cursor:pointer}
.recommendBtn:hover{background:#fff1c7}
.freeShipHint{background:#eaf8ef;border:1px solid #b7e0c3;color:#116b2d;border-radius:8px;padding:10px;margin:10px 0;font-weight:bold}
.topHint{background:#fff8e8;border:1px solid #e5c77b;color:#5b3b00;border-radius:999px;padding:7px 14px;font-size:16px;font-weight:bold}
.topFreeBtn{background:#9b4d36!important;color:white!important;border:0!important;border-radius:999px!important;padding:8px 14px!important;font-size:16px!important;cursor:pointer!important}
.savedDeliveryBox{background:#f7fbff;border:1px solid #c9ddf2;border-radius:10px;padding:12px;margin:12px 0;line-height:1.7}
.savedDeliveryTitle{font-weight:bold;font-size:18px;margin-bottom:6px}
.hidden{display:none!important}

@media (max-width:700px){
  body{font-size:18px}
  header{font-size:24px;padding:18px}
  .topCart{font-size:18px;flex-direction:column}
  .layout{flex-direction:column;height:auto}
  .side{width:auto;display:flex;overflow-x:auto;gap:10px;padding:10px}
  .side button{width:auto;min-width:150px;font-size:18px;padding:16px;margin-bottom:0}
  .main{padding:12px}
  #title{font-size:30px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .box{width:auto;min-height:100px;font-size:20px;padding:16px 10px}
  .panel{padding:14px;max-width:none}
  .panel h2{font-size:30px}
  .panel h3{font-size:24px}
  .extraRow{grid-template-columns:90px 1fr 120px;font-size:18px;padding:12px}
  .circle{width:76px;height:76px}
  .checkBox{width:44px;height:44px}
  .qtyBtn{width:42px;height:42px;font-size:24px}
  .qtyNum{font-size:22px}
  .addBtn,.confirmBtn{width:100%;font-size:24px;padding:18px}
  .cart{font-size:20px}
  .cartTitle{font-size:30px}
  .cartTotal{font-size:26px}
  .deleteBtn{font-size:18px;padding:10px 16px}
  .backBtn{font-size:20px;padding:12px 18px}
}
</style>
</head>

<body>

<div class="loading" id="loading"><div class="spinner"></div>טוען...</div>

<div class="msgOverlay" id="msgOverlay">
  <div class="msgBox">
    <div class="msgText" id="msgText"></div>
    <button class="msgBtn" onclick="closeMessage()">אישור</button>
  </div>
</div>


<header>🍕 הטאבון</header>

<div class="topCart" id="topCart">
  <span id="topCartDelivery" class="deliveryBadge hidden"></span>
  <span id="topCartHint" class="topHint hidden"></span>
  <button id="topFreeBtn" class="topFreeBtn hidden" onclick="showFreeDeliveryInfo()">רוצים משלוח חינם?</button>
  <span id="topCartTotal">סה"כ: ₪0</span>
  <button onclick="openCheckout()">מעבר לתשלום</button>
</div>

<div class="layout">
  <div class="side" id="cats"></div>

  <div class="main">
    <button class="backBtn" id="backBtn" onclick="goBack()">⬅ חזור</button>
    <h2 id="title">בחר קטגוריה</h2>
    <div id="items" class="grid"></div>

    <div class="cart" id="cartBox">
      <h2 class="cartTitle">סל:</h2>
      <div id="cartItems">ריק</div>
      <div id="cartTotal" class="cartTotal">סה"כ: ₪0</div>
      <button class="payBtn" onclick="openCheckout()">מעבר לתשלום</button>
    </div>
  </div>
</div>

<script>
const SERVER = window.location.origin;
const API = SERVER + "/api/menu";
const ORDER_API = SERVER + "/api/order";

let data = {};
let currentCategory = null;
let parentId = -1;
let stack = [];
let currentItem = null;
let cart = [];
let checkoutType = "";
let paymentMethod = "";
let tempExtras = [];
let tempCombos = [];
let savedCheckout = {};
let orderMode = "";
let selectedDeliveryCategory = "";
let selectedDeliveryArea = null;
let deliveryAddressDetails = {};
let currentScreen = "menu";

function showLoading(){document.getElementById("loading").style.display="flex";}
function hideLoading(){document.getElementById("loading").style.display="none";}
function showMessage(text){
  document.getElementById("msgText").innerText = text;
  document.getElementById("msgOverlay").style.display = "flex";
}
function closeMessage(){
  document.getElementById("msgOverlay").style.display = "none";
}
function showCartAreas(){document.getElementById("cartBox").classList.remove("hidden");document.getElementById("topCart").classList.remove("hidden");updateTopDeliveryBadge();}
function hideCartAreas(){document.getElementById("cartBox").classList.add("hidden");document.getElementById("topCart").classList.add("hidden");}
function showCategoryMenu(){document.getElementById("cats").classList.remove("hidden");}
function hideCategoryMenu(){document.getElementById("cats").classList.add("hidden");}
function updateTopDeliveryBadge(){
  const badge = document.getElementById("topCartDelivery");
  const hint = document.getElementById("topCartHint");

  if(badge){
    if(orderMode === "delivery" && selectedDeliveryArea){
      const eta = String(selectedDeliveryArea["צפי למשלוח בדקות"] || "").trim();
      const name = String(selectedDeliveryArea["שם"] || "").trim();
      badge.innerText = `משלוח: ${name}${eta ? " | " + eta + " דקות" : ""}`;
      badge.classList.remove("hidden");
    }else if(orderMode === "pickup"){
      badge.innerText = "איסוף עצמי";
      badge.classList.remove("hidden");
    }else{
      badge.innerText = "";
      badge.classList.add("hidden");
    }
  }

  const freeBtn = document.getElementById("topFreeBtn");

  if(hint){
    if(orderMode === "delivery" && selectedDeliveryArea){
      const deliveryPrice = getDeliveryFinalPrice();
      hint.innerText = `עלות משלוח: ${deliveryPrice > 0 ? "₪" + cleanMoney(deliveryPrice) : "חינם"}`;
      hint.classList.remove("hidden");
    }else{
      hint.innerText = "";
      hint.classList.add("hidden");
    }
  }

  if(freeBtn){
    const freeAbove = getDeliveryFreeAbove();
    const itemsTotal = getCartItemsTotal();
    if(orderMode === "delivery" && selectedDeliveryArea && freeAbove > 0 && itemsTotal < freeAbove){
      freeBtn.classList.remove("hidden");
    }else{
      freeBtn.classList.add("hidden");
    }
  }
}

function showFreeDeliveryInfo(){
  if(orderMode !== "delivery" || !selectedDeliveryArea) return;

  const deliveryPrice = getDeliveryBasePrice();
  const freeAbove = getDeliveryFreeAbove();
  const itemsTotal = getCartItemsTotal();

  if(!freeAbove){
    showMessage(`עלות המשלוח היא ₪${cleanMoney(deliveryPrice)}`);
    return;
  }

  const missing = Math.max(0, freeAbove - itemsTotal);
  const text = missing > 0
    ? `עלות המשלוח היא ₪${cleanMoney(deliveryPrice)}\nלמשלוח חינם צריך להגיע ל־₪${cleanMoney(freeAbove)} להזמנה\nכרגע חסרים עוד ₪${cleanMoney(missing)} לקבל את המשלוח בחינם`
    : `עלות המשלוח היא ₪${cleanMoney(deliveryPrice)}\nהגעת לסכום המזכה במשלוח חינם`;

  showMessage(text);
}

async function start(){
  currentScreen = "start";
  hideCartAreas();
  hideCategoryMenu();
  showLoading();

  try{
    const res = await fetch(API);
    data = await res.json();

    data.categories = data.categories || [];
    data.items = data.items || [];
    data.extras = data.extras || [];
    data.itemExtraLinq = data.itemExtraLinq || data.itemExtraLinks || [];
    data.deliveryCategories = data.deliveryCategories || [];
    data.deliveryAreas = data.deliveryAreas || [];

    renderCategories();
    renderStartChoice();
  }catch(err){
    document.getElementById("items").innerHTML = "שגיאה בטעינת התפריט";
    console.error(err);
  }

  hideLoading();
  renderCart();
}

function getSavedDeliverySelection(){
  try{
    const raw = localStorage.getItem("hataboon_delivery_selection");
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(err){
    return null;
  }
}

function saveDeliverySelection(){
  if(orderMode !== "delivery" || !selectedDeliveryArea) return;

  const payload = {
    areaId: String(selectedDeliveryArea.ID || ""),
    category: selectedDeliveryCategory || "",
    addressDetails: deliveryAddressDetails || {}
  };

  try{
    localStorage.setItem("hataboon_delivery_selection", JSON.stringify(payload));
  }catch(err){}
}

function clearSavedDeliverySelection(){
  try{
    localStorage.removeItem("hataboon_delivery_selection");
  }catch(err){}
}

function getSavedDeliveryArea(){
  const saved = getSavedDeliverySelection();
  if(!saved || !saved.areaId) return null;

  const area = (data.deliveryAreas || []).find(a => String(a.ID) === String(saved.areaId));
  if(!area) return null;

  const active = String(area["פעיל/חסום להזמנות"] || "").trim();
  if(active !== "פתוח") return null;

  return { saved, area };
}

function restoreLastDeliveryArea(){
  const found = getSavedDeliveryArea();

  if(!found){
    showMessage("אזור המשלוח האחרון כבר לא זמין כרגע");
    clearSavedDeliverySelection();
    renderDeliveryCategories();
    return;
  }

  orderMode = "delivery";
  checkoutType = "delivery";
  selectedDeliveryArea = found.area;
  selectedDeliveryCategory = found.saved.category || String(found.area["ברגע ש"] || "").trim();
  deliveryAddressDetails = found.saved.addressDetails || {};

  enterMenuAfterDelivery();
}

function renderStartChoice(){
  currentScreen = "start";
  hideCartAreas();
  hideCategoryMenu();

  const savedDelivery = getSavedDeliveryArea();
  const savedHtml = savedDelivery ? `
    <div class="savedDeliveryBox">
      <div class="savedDeliveryTitle">משלוח אחרון</div>
      <div>${escapeHtml(savedDelivery.area["שם"] || "")}</div>
      <button class="optionBtn" onclick="restoreLastDeliveryArea()">המשך עם המשלוח האחרון</button>
      <button class="optionBtn" onclick="clearSavedDeliverySelection(); renderStartChoice()">מחק שמירה</button>
    </div>
  ` : "";

  document.getElementById("title").innerText = "איך תרצה להזמין?";
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>איך תרצה לקבל את ההזמנה?</h2>
      <button class="optionBtn" onclick="chooseOrderMode('pickup')">איסוף עצמי</button>
      <button class="optionBtn" onclick="chooseOrderMode('delivery')">משלוח</button>
      ${savedHtml}
    </div>
  `;
}

function chooseOrderMode(mode){
  orderMode = mode;
  checkoutType = mode;
  selectedDeliveryCategory = "";
  selectedDeliveryArea = null;
  deliveryAddressDetails = {};

  if(mode === "pickup"){
    showCategoryMenu();
    showCartAreas();
    document.getElementById("title").innerText = "בחר קטגוריה";
    document.getElementById("items").className = "grid";
    document.getElementById("items").innerHTML = "";
    updateTopDeliveryBadge();
    renderCart();
    return;
  }

  renderDeliveryCategories();
}

function getDeliveryCategories(){
  const rows = data.deliveryCategories || [];
  const fromSheet = rows
    .map(r => String(r["שיוך לקטגוריה"] || r["שם"] || r["קטגוריה"] || "").trim())
    .filter(Boolean);

  if(fromSheet.length) return [...new Set(fromSheet)];

  return [...new Set((data.deliveryAreas || [])
    .map(r => String(r["ברגע ש"] || "").trim())
    .filter(Boolean))];
}

function renderDeliveryCategories(){
  currentScreen = "delivery_categories";
  hideCartAreas();
  hideCategoryMenu();
  hideCategoryMenu();

  const categories = getDeliveryCategories();

  document.getElementById("title").innerText = "בחר קטגוריית משלוח";
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>לאן תרצה משלוח?</h2>
      <div class="grid">
        ${categories.map(cat => `<div class="box cat" onclick="selectDeliveryCategory('${escapeJs(cat)}')">${escapeHtml(cat)}</div>`).join("")}
      </div>
      <button class="confirmBtn" onclick="renderStartChoice()">חזרה</button>
    </div>
  `;
}

function selectDeliveryCategory(category){
  selectedDeliveryCategory = category;
  renderDeliveryAreas();
}

function renderDeliveryAreas(){
  currentScreen = "delivery_areas";
  hideCartAreas();
  hideCategoryMenu();
  hideCategoryMenu();

  const areas = (data.deliveryAreas || []).filter(a =>
    String(a["ברגע ש"] || "").trim() === String(selectedDeliveryCategory).trim()
  );

  document.getElementById("title").innerText = selectedDeliveryCategory;
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>בחר מקום</h2>
      <div class="grid">
        ${areas.map(area => `<div class="box" onclick="selectDeliveryArea('${escapeJs(String(area.ID))}')">${escapeHtml(area["שם"] || "")}</div>`).join("")}
      </div>
      <button class="confirmBtn" onclick="renderDeliveryCategories()">חזרה לקטגוריות</button>
    </div>
  `;
}

function selectDeliveryArea(id){
  const area = (data.deliveryAreas || []).find(a => String(a.ID) === String(id));
  if(!area) return;

  selectedDeliveryArea = area;

  const active = String(area["פעיל/חסום להזמנות"] || "").trim();
  const areaName = String(area["שם"] || "").trim();

  if((active || "").trim() !== "פתוח"){
    currentScreen = "delivery_blocked";
    document.getElementById("title").innerText = "משלוח לא זמין";
    document.getElementById("items").className = "";
    document.getElementById("items").innerHTML = `
      <div class="panel">
        <h2>לא ניתן כרגע לבצע הזמנה ל${escapeHtml(areaName)}</h2>
        <p>מומלץ לבצע הזמנה באיסוף עצמי.</p>
        <button class="confirmBtn" onclick="renderStartChoice()">חזרה לבחירת איסוף עצמי / משלוח</button>
      </div>
    `;
    return;
  }

  renderDeliveryAreaInfo();
}

function renderDeliveryAreaInfo(){
  currentScreen = "delivery_info";
  hideCartAreas();
  hideCategoryMenu();
  hideCategoryMenu();

  const a = selectedDeliveryArea || {};
  const name = String(a["שם"] || "").trim();
  const minOrder = numberOrZero(a["מינימום הזמנה"]);
  const deliveryPrice = numberOrZero(a["עלות משלוח"]);
  const freeAbove = numberOrZero(a["משלוח חינם מעל ל:"]);
  const eta = String(a["צפי למשלוח בדקות"] || "").trim();

  document.getElementById("title").innerText = "פרטי משלוח";
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>${escapeHtml(name)}</h2>
      <div class="infoBox">
        <div><b>מינימום הזמנה:</b> ${minOrder ? "₪" + cleanMoney(minOrder) : "אין"}</div>
        <div><b>עלות משלוח:</b> ₪${cleanMoney(deliveryPrice)}</div>
        <div><b>משלוח חינם מעל:</b> ${freeAbove ? "₪" + cleanMoney(freeAbove) : "אין"}</div>
        <div><b>צפי למשלוח:</b> ${eta ? escapeHtml(eta) + " דקות" : "לא צוין"}</div>
      </div>
      <button class="confirmBtn" onclick="confirmDeliveryAreaInfo()">אישור והמשך</button>
      <button class="optionBtn" onclick="renderDeliveryAreas()">חזרה</button>
    </div>
  `;
}

function confirmDeliveryAreaInfo(){
  const needFullAddress = String(selectedDeliveryArea?.["כתובת מלאה"] || "").trim();
  if(needFullAddress === "כן"){
    renderDeliveryFullAddress();
  }else{
    deliveryAddressDetails = {};
    enterMenuAfterDelivery();
  }
}

function renderDeliveryFullAddress(){
  currentScreen = "delivery_address";
  hideCartAreas();
  hideCategoryMenu();
  hideCategoryMenu();

  document.getElementById("title").innerText = "כתובת מלאה";
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>הכנס כתובת למשלוח</h2>
      <div class="formRow"><label>רחוב</label><input id="deliveryStreet" type="text"></div>
      <div class="formRow"><label>מספר בית</label><input id="deliveryHouseNumber" type="text"></div>
      <div class="formRow"><label>מספר דירה</label><input id="deliveryApartment" type="text"></div>
      <div class="formRow"><label>קומה</label><input id="deliveryFloor" type="text"></div>
      <button class="confirmBtn" onclick="saveDeliveryFullAddress()">אישור והמשך לתפריט</button>
    </div>
  `;
}

function saveDeliveryFullAddress(){
  const street = document.getElementById("deliveryStreet")?.value.trim() || "";
  const houseNumber = document.getElementById("deliveryHouseNumber")?.value.trim() || "";

  if(!street || !houseNumber){
    showMessage("נא למלא רחוב ומספר בית");
    return;
  }

  deliveryAddressDetails = {
    street,
    houseNumber,
    apartment: document.getElementById("deliveryApartment")?.value.trim() || "",
    floor: document.getElementById("deliveryFloor")?.value.trim() || ""
  };

  enterMenuAfterDelivery();
}

function enterMenuAfterDelivery(){
  currentScreen = "menu";
  saveDeliverySelection();
  showCategoryMenu();
  showCartAreas();
  document.getElementById("title").innerText = "בחר קטגוריה";
  document.getElementById("items").className = "grid";
  document.getElementById("items").innerHTML = "";
  updateTopDeliveryBadge();
  renderCart();
}

function getDeliveryBasePrice(){
  if(orderMode !== "delivery" || !selectedDeliveryArea) return 0;
  return numberOrZero(selectedDeliveryArea["עלות משלוח"]);
}

function getDeliveryFreeAbove(){
  if(orderMode !== "delivery" || !selectedDeliveryArea) return 0;
  return numberOrZero(selectedDeliveryArea["משלוח חינם מעל ל:"]);
}

function getDeliveryMinOrder(){
  if(orderMode !== "delivery" || !selectedDeliveryArea) return 0;
  return numberOrZero(selectedDeliveryArea["מינימום הזמנה"]);
}

function getDeliveryFinalPrice(){
  const base = getDeliveryBasePrice();
  const freeAbove = getDeliveryFreeAbove();
  const itemsTotal = getCartItemsTotal();
  if(base > 0 && freeAbove > 0 && itemsTotal >= freeAbove) return 0;
  return base;
}

function getCartItemsTotal(){
  return cart.reduce((s,i)=>s+Number(i.total||0),0);
}

function buildDeliveryAddressText(){
  if(orderMode !== "delivery" || !selectedDeliveryArea) return "";
  const areaName = String(selectedDeliveryArea["שם"] || "").trim();
  const d = deliveryAddressDetails || {};
  const parts = [areaName];
  if(d.street || d.houseNumber) parts.push(`${d.street || ""} ${d.houseNumber || ""}`.trim());
  if(d.apartment) parts.push("דירה " + d.apartment);
  if(d.floor) parts.push("קומה " + d.floor);
  return parts.filter(Boolean).join(", ");
}

function buildDeliveryItem(){
  const price = getDeliveryFinalPrice();
  if(orderMode !== "delivery" || price <= 0) return null;

  return {
    itemNo: 10230,
    itemDesc: "עלות משלוח",

function getSimpleRecommendedProducts(amountNeeded){
  const visibleCategoryIds = new Set((data.categories || [])
    .filter(c => String(c["אתר/אפליקציה"]).trim() === "כן")
    .map(c => String(c["מספר קטגורייה"])));

  const candidates = (data.items || []).filter(item => {
    const price = Number(item.ItemPrice || 0);
    if(!Number.isFinite(price) || price <= 0) return false;
    if(Number(item.IsActive) !== 0) return false;
    if(Number(item.IsCategory) === -1) return false;
    if(String(item.ItemNo) === "10230") return false;
    if(visibleCategoryIds.size && !visibleCategoryIds.has(String(item.ItemCategory))) return false;
    if(Number(item.ItemExtra) === -1) return false;
    if(getSliceCount(item) > 1) return false;
    if(getCombos(item, 0).length > 0) return false;
    return true;
  });

  const above = candidates
    .filter(item => Number(item.ItemPrice || 0) >= amountNeeded)
    .sort((a,b) => Number(a.ItemPrice || 0) - Number(b.ItemPrice || 0));

  const below = candidates
    .filter(item => Number(item.ItemPrice || 0) < amountNeeded)
    .sort((a,b) => Number(b.ItemPrice || 0) - Number(a.ItemPrice || 0));

  const result = [];
  [...above, ...below].forEach(item => {
    if(result.length >= 5) return;
    if(!result.some(x => String(x.ItemNo) === String(item.ItemNo))){
      result.push(item);
    }
  });

  return result;
}

function buildRecommendationsHtml(){
  if(orderMode !== "delivery" || !selectedDeliveryArea || cart.length === 0) return "";

  const itemsTotal = getCartItemsTotal();
  const minOrder = getDeliveryMinOrder();
  const freeAbove = getDeliveryFreeAbove();

  let target = 0;
  let reason = "";

  if(minOrder > 0 && itemsTotal < minOrder){
    target = minOrder;
    reason = `חסר לך ₪${cleanMoney(minOrder - itemsTotal)} כדי להגיע למינימום הזמנה`;
  }else if(freeAbove > 0 && itemsTotal < freeAbove){
    target = freeAbove;
    reason = `אפשר לקבל משלוח חינם בהזמנה מעל ₪${cleanMoney(freeAbove)}. חסרים עוד ₪${cleanMoney(freeAbove - itemsTotal)}`;
  }

  if(!target) return "";

  const needed = Math.max(1, target - itemsTotal);
  const products = getSimpleRecommendedProducts(needed);

  if(!products.length){
    return `
      <div class="recommendBox">
        <div class="recommendTitle">${reason}</div>
        <div>אפשר להוסיף מוצר קטן נוסף מהתפריט כדי לסגור את ההזמנה.</div>
      </div>
    `;
  }

  return `
    <div class="recommendBox">
      <div class="recommendTitle">${reason}</div>
      <div>אפשר להוסיף מוצר קטן כדי לסגור את ההזמנה:</div>
      <div class="recommendItems">
        ${products.map(item => `<button class="recommendBtn" onclick="addRecommendedProduct('${escapeJs(item.ItemNo)}')">${escapeHtml(item.ItemDesc)} - ₪${cleanMoney(item.ItemPrice)}</button>`).join("")}
      </div>
    </div>
  `;
}

function addRecommendedProduct(itemNo){
  const item = (data.items || []).find(i => String(i.ItemNo) === String(itemNo));
  if(!item) return;

  const wasUpsell = currentScreen === "checkout_upsell";
  addItemToCart(item, []);

  if(wasUpsell){
    showMessage(`${item.ItemDesc} נוסף לסל`);
    openCheckout();
  }else{
    showMessage(`${item.ItemDesc} נוסף לסל`);
  }
}


function numberOrZero(v){
  if(typeof v === "number") return Number.isFinite(v) ? v : 0;
  const text = String(v || "").replace(",", ".");
  const match = text.match(/-?\d+(?:\.\d+)?/);
  if(!match) return 0;
  const n = Number(match[0]);
  return Number.isFinite(n) ? n : 0;
}

function escapeHtml(v){
  return String(v || "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch] || ch));
}

function escapeJs(v){
  return String(v || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " ");
}

  showCartAreas();

  document.getElementById("title").innerText = title;

  grid.className = "grid";
  grid.innerHTML = "";

  );

      box.onclick = () => openProduct(item, title);

function openProduct(item, title){
  showLoading();

  setTimeout(()=>{
    const hasRegularExtras = Number(item.ItemExtra) === -1;
    const hasPizzaParts = getSliceCount(item) > 1;
    const hasCombos = getCombos(item, 0).length > 0;

    if(hasRegularExtras || hasPizzaParts){
      openExtrasStep(item, title);
    }else if(hasCombos){
      currentItem = item;
      tempExtras = [];
      tempCombos = [];
      stack.push({type:"product", parentId, title});
      openCombosStep();
    }else{
      addItemToCart(item, []);
    }

    hideLoading();
  },80);
}

function openExtrasStep(item, title){

function renderExtras(item){
  const box = document.getElementById("extras");
  box.innerHTML = "";

  if(Number(item.ItemExtra) !== -1 && getSliceCount(item) <= 1){
    box.innerHTML = "אין תוספות למוצר הזה";
    return;
  }

  const extras = data.extras.filter(e =>
    Number(e.ItemSize) === Number(item.ItemSize) &&
    Number(e.NotActive) === 0
  ).sort((a,b)=>Number(a.ExtraGuiOrder||0)-Number(b.ExtraGuiOrder||0));

  if(extras.length === 0){
    box.innerHTML = "אין תוספות למוצר הזה";
    return;
  }

  extras.forEach(ex => box.appendChild(createOptionRow(ex, item, "extra")));

function renderCombos(item){
  const box = document.getElementById("combos");
  box.innerHTML = "";

  const combos = getCombos(item, 0);

  if(combos.length === 0){
    box.innerHTML = "אין שילובים למוצר הזה";
    return;
  }

  combos.forEach(ex => box.appendChild(createOptionRow(ex, item, "combo")));
}

function getCombos(item, step){
  const links = (data.itemExtraLinq || []).filter(l =>
    Number(l.ItemNo) === Number(item.ItemNo) &&
    Number(l.Price || 0) === Number(step)
  );

  return links
    .map(l => data.extras.find(e => Number(e.ExtraNo) === Number(l.ExtraNo)))
    .filter(Boolean)
    .filter(e => Number(e.NotActive) === 0);
}

function getSliceCount(item){
  const name = String(item.ItemDesc || "");

  if(name.includes("מדיום")){
    return 2;
  }

  const n = Number(item.SliceNo) || 1;
  return n;
}

function getComboPaidPrice(extraDesc, extraNo){
  const itemByNo = data.items.find(i =>
    Number(i.ItemNo) === Number(extraNo) &&
    Number(i.IsCategory) === 0 &&
    Number(i.IsActive) === 0
  );

  if(itemByNo) return Number(itemByNo.ItemPrice || 0);

  const itemByName = data.items.find(i =>
    String(i.ItemDesc || "").trim() === String(extraDesc || "").trim() &&
    Number(i.IsCategory) === 0 &&
    Number(i.IsActive) === 0
  );

  if(itemByName) return Number(itemByName.ItemPrice || 0);

  return 0;
}

function createOptionRow(ex, item, type){
  const row = document.createElement("div");
  row.className = "extraRow";

  row.dataset.price = type === "combo"
    ? getComboPaidPrice(ex.ExtraDesc, ex.ExtraNo)
    : Number(ex.ExtraPrice || 0);

  row.dataset.free = isFreeExtra(ex) ? "1" : "0";
  row.dataset.extraNo = ex.ExtraNo;
  row.dataset.extraDesc = ex.ExtraDesc;
  row.dataset.extraParve = ex.ExtraParve || 0;
  row.dataset.type = type;
  row.dataset.sum = 0;
  row.dataset.qty = 0;

  const selector = document.createElement("div");
  const sliceCount = getSliceCount(item);

  if(type === "combo"){
    selector.className = "qtyBox";
    selector.innerHTML = `
      <button class="qtyBtn" type="button">+</button>
      <span class="qtyNum">0</span>
      <button class="qtyBtn" type="button">−</button>
    `;

    const plus = selector.children[0];
    const num = selector.children[1];
    const minus = selector.children[2];

    plus.onclick = e => {
      e.stopPropagation();
      row.dataset.qty = Number(row.dataset.qty || 0) + 1;
      num.innerText = row.dataset.qty;
      updatePrices();
    };

    minus.onclick = e => {
      e.stopPropagation();
      row.dataset.qty = Math.max(0, Number(row.dataset.qty || 0) - 1);
      num.innerText = row.dataset.qty;
      updatePrices();
    };

  }else if(sliceCount > 1){
    selector.className = "circle";

    const cols =
      sliceCount === 2 ? 2 :
      sliceCount === 8 ? 4 :
      sliceCount === 6 ? 3 :
      sliceCount === 4 ? 2 :
      2;

    selector.style.gridTemplateColumns = `repeat(${cols},1fr)`;
    selector.style.gridTemplateRows = sliceCount === 2
      ? `repeat(1,1fr)`
      : `repeat(${Math.ceil(sliceCount / cols)},1fr)`;

    for(let i=0;i<sliceCount;i++){
      const q = document.createElement("div");
      q.className = "q";
      q.dataset.part = i + 1;
      q.onclick = e => {
        e.stopPropagation();
        q.classList.toggle("on");
        updatePrices();
      };
      selector.appendChild(q);
    }

  }else{
    selector.className = "checkBox";
    selector.dataset.part = 1;
    selector.onclick = e => {
      e.stopPropagation();
      selector.classList.toggle("on");
      updatePrices();
    };
  }

  row.innerHTML = `
    <div class="priceBox">₪0</div>
    <div class="extraName">${ex.ExtraDesc}</div>
  `;

  row.appendChild(selector);
  return row;
}

function isFreeExtra(ex){
  const v = String(ex.ExtraParve || "").trim();
  return v !== "" && v !== "0" && v !== "לא";
}

function getSelectedParts(row){
  return [...row.querySelectorAll(".q.on,.checkBox.on")]
    .map(x => Number(x.dataset.part || 1));
}

function updatePrices(){
  const rows = [...document.querySelectorAll(".extraRow")];
  const sliceCount = getSliceCount(currentItem || {});
  const freePartsTotal = Number(currentItem?.FreeExtra || 0) * sliceCount;

  let freeUsed = 0;
  let comboFreeUsed = false;

  rows.forEach(row => {
    const type = row.dataset.type;
    const pricePerUnit = Number(row.dataset.price || 0);
    const priceBox = row.querySelector(".priceBox");

    if(type === "combo"){
      const qty = Number(row.dataset.qty || 0);
      let freeQty = 0;

      if(qty > 0 && comboFreeUsed === false){
        freeQty = 1;
        comboFreeUsed = true;
      }

      const paidQty = Math.max(0, qty - freeQty);
      const sum = paidQty * pricePerUnit;

      row.dataset.sum = sum;
      row.dataset.freeUsed = freeQty;
      row.dataset.paidParts = paidQty;

      row.classList.toggle("selected", qty > 0);

      if(qty === 0){
        priceBox.innerText = "₪0";
      }else if(sum === 0){
        priceBox.innerText = "חינם";
      }else{
        priceBox.innerText = "₪" + cleanMoney(sum);
      }

      return;
    }

    const parts = getSelectedParts(row);
    const selected = parts.length;

    row.classList.toggle("selected", selected > 0);

    const canBeFree = row.dataset.free === "1";
    let paidParts = selected;
    let freeForThis = 0;

    if(canBeFree && freeUsed < freePartsTotal){
      const freeLeft = freePartsTotal - freeUsed;
      freeForThis = Math.min(selected, freeLeft);
      paidParts = selected - freeForThis;
      freeUsed += freeForThis;
    }

    const sum = paidParts * pricePerUnit;

    row.dataset.sum = sum;
    row.dataset.freeUsed = freeForThis;
    row.dataset.paidParts = paidParts;

    if(selected === 0){
      priceBox.innerText = "₪0";
    }else if(sum === 0 && canBeFree){
      priceBox.innerText = "חינם";
    }else{
      priceBox.innerText = "₪" + cleanMoney(sum);
    }
  });

  const freeText = document.getElementById("freeText");

  if(freeText){
    freeText.innerText = freePartsTotal > 0 && freeUsed < freePartsTotal
      ? "תוספת חינם"
      : "";
  }
}

function collectSelectedRows(){
  return [...document.querySelectorAll(".extraRow")]
    .map(row => {
      const type = row.dataset.type;
      const sliceCount = getSliceCount(currentItem || {});

      if(type === "combo"){
        const qty = Number(row.dataset.qty || 0);
        if(qty === 0) return null;

        return {
          extraNo: row.dataset.extraNo,
          extraDesc: row.dataset.extraDesc,
          extraParve: row.dataset.extraParve,
          extraPrice: Number(row.dataset.price || 0),
          type,
          qty,
          parts:[1],
          freeUsed: Number(row.dataset.freeUsed || 0),
          paidParts: Number(row.dataset.paidParts || 0),
          sum: Number(row.dataset.sum || 0),
          full:0,
          rh:0,
          lh:0,
          q14:0,
          q24:0,
          q34:0,
          q44:0
        };
      }

      const parts = getSelectedParts(row);
      if(parts.length === 0) return null;

      const isPizzaExtra = sliceCount > 1 && type === "extra";

      return {
        extraNo: row.dataset.extraNo,
        extraDesc: row.dataset.extraDesc,
        extraParve: row.dataset.extraParve,
        extraPrice: Number(row.dataset.price || 0),
        type,
        qty:1,
        parts,
        freeUsed: Number(row.dataset.freeUsed || 0),
        paidParts: Number(row.dataset.paidParts || 0),
        sum: Number(row.dataset.sum || 0),
        full: isPizzaExtra && parts.length === sliceCount ? -1 : 0,
        rh: parts.includes(1) ? -1 : 0,
        lh: parts.includes(2) ? -1 : 0,
        q14: parts.includes(1) ? -1 : 0,
        q24: parts.includes(2) ? -1 : 0,
        q34: parts.includes(3) ? -1 : 0,
        q44: parts.includes(4) ? -1 : 0
      };
    })
    .filter(Boolean);
}

function addItemToCart(item, extras){
  const previousScreen = currentScreen;
  currentScreen = previousScreen === "checkout_upsell" ? "checkout_upsell" : "menu";
  if(currentScreen === "menu") showCategoryMenu();
  const extrasTotal = extras.reduce((s,e)=>s+Number(e.sum||0),0);
  const base = Number(item.ItemPrice || 0);

  cart.push({
    itemNo:item.ItemNo,
    itemDesc:item.ItemDesc,
    itemCategory:item.ItemCategory,
    itemPrice:base,
    extraReduse:item.ExtraReduse || 0,
    qty:1,
    sliceNo:getSliceCount(item),
    itemDescLong:item.ItemDescLong || "",
    freeExtra:item.FreeExtra || 0,
    freeExtraFrom:item.FreeExtraFrom || 0,
    itemGroup:item.ItemGroup || "",
    displayColor:item.DisplayColor || "",
    extras,
    total:base + extrasTotal
  });

  renderCart();
}

function removeCartItem(index){
  cart.splice(index,1);
  renderCart();
}

function getCartTotal(){
  return getCartItemsTotal() + getDeliveryFinalPrice();
}

function renderCart(){
  updateTopDeliveryBadge();
  const el = document.getElementById("cartItems");
  const totalEl = document.getElementById("cartTotal");
  const topTotal = document.getElementById("topCartTotal");

  if(cart.length === 0){
    el.innerHTML = "ריק";
    totalEl.innerText = "סה\"כ: ₪0";
    topTotal.innerText = "סה\"כ: ₪0";
    return;
  }

  el.innerHTML = cart.map((item,idx)=>{
    const extrasHtml = item.extras.length
      ? item.extras.map(e => {
          if(e.type === "combo"){
            const priceText = e.sum === 0 ? "חינם" : `₪${cleanMoney(e.sum)}`;
            return `<div>↳ ${e.extraDesc} × ${e.qty} - ${priceText}</div>`;
          }

          const partsText = e.parts.length > 1 ? `חלקים: ${e.parts.join(", ")}` : "";
          const priceText = e.sum === 0 ? "חינם" : `₪${cleanMoney(e.sum)}`;
          return `<div>↳ ${e.extraDesc} ${partsText} - ${priceText}</div>`;
        }).join("")
      : "";

    return `
      <div class="cartLine">
        <b>${idx+1}. ${item.itemDesc}</b> - ₪${cleanMoney(item.total)}
        ${extrasHtml}
        <br><button class="deleteBtn" onclick="removeCartItem(${idx})">מחק מהסל</button>
      </div>
    `;
  }).join("");

  const deliveryPrice = getDeliveryFinalPrice();
  const minOrder = getDeliveryMinOrder();
  const freeAbove = getDeliveryFreeAbove();

  if(orderMode === "delivery" && selectedDeliveryArea){
    const eta = String(selectedDeliveryArea["צפי למשלוח בדקות"] || "").trim();
    const itemsTotal = getCartItemsTotal();
    const freeShipButton = freeAbove && itemsTotal < freeAbove
      ? `<br><button class="recommendBtn" onclick="showFreeDeliveryInfo()">רוצים משלוח חינם?</button>`
      : "";

    el.innerHTML += `
      <div class="cartLine">
        <b>משלוח: ${escapeHtml(selectedDeliveryArea["שם"] || "")}</b><br>
        עלות משלוח: ${deliveryPrice > 0 ? "₪" + cleanMoney(deliveryPrice) : "חינם"}
        ${freeAbove ? `<br>משלוח חינם מעל ₪${cleanMoney(freeAbove)}` : ""}
        ${minOrder ? `<br>מינימום הזמנה ₪${cleanMoney(minOrder)}` : ""}
        ${eta ? `<br>צפי משלוח: ${escapeHtml(eta)} דקות` : ""}
        ${freeShipButton}
      </div>
    `;

  }

  const totalText = `סה"כ: ₪${cleanMoney(getCartTotal())}`;
  totalEl.innerText = totalText;
  topTotal.innerText = totalText;
}

function openCheckout(){
  if(currentScreen === "extras" || currentScreen === "combos"){
    showMessage("עדיין לא הוספת את המוצר לסל");
    return;
  }

  if(!orderMode){
    showMessage("נא לבחור איסוף עצמי או משלוח");
    renderStartChoice();
    return;
  }

  if(orderMode === "delivery" && !selectedDeliveryArea){
    showMessage("נא לבחור אזור משלוח");
    renderDeliveryCategories();
    return;
  }

  if(cart.length === 0){
    showMessage("הסל ריק");
    return;
  }

  if(orderMode === "delivery"){
    const minOrder = getDeliveryMinOrder();
    const freeAbove = getDeliveryFreeAbove();
    const itemsTotal = getCartItemsTotal();

    if(minOrder > 0 && itemsTotal < minOrder){
      renderCheckoutUpsell("min");
      return;
    }

    if(freeAbove > 0 && itemsTotal < freeAbove && getDeliveryFinalPrice() > 0){
      renderCheckoutUpsell("freePaid");
      return;
    }
  }

  continueToCheckoutDetails();
}

function renderCheckoutUpsell(mode){
  currentScreen = "checkout_upsell";
  hideCategoryMenu();
  hideCartAreas();

  const itemsTotal = getCartItemsTotal();
  const minOrder = getDeliveryMinOrder();
  const freeAbove = getDeliveryFreeAbove();
  const deliveryPrice = getDeliveryBasePrice();

  let title = "השלמת הזמנה";
  let infoHtml = "";
  let target = 0;

  if(mode === "min"){
    target = minOrder;
    infoHtml = `
      <h2>חסר לך ₪${cleanMoney(minOrder - itemsTotal)} כדי להגיע למינימום הזמנה</h2>
      <div class="infoBox">
        מינימום הזמנה לאזור זה הוא ₪${cleanMoney(minOrder)}.<br>
        כרגע סכום המוצרים הוא ₪${cleanMoney(itemsTotal)}.<br>
        אפשר להוסיף מוצר קטן כדי לסגור את ההזמנה.
      </div>
    `;
  }else{
    target = freeAbove;
    infoHtml = `
      <h2>רוצים משלוח חינם?</h2>
      <div class="infoBox">
        עלות המשלוח היא ₪${cleanMoney(deliveryPrice)}.<br>
        למשלוח חינם צריך להגיע ל־₪${cleanMoney(freeAbove)} להזמנה.<br>
        כרגע חסרים עוד ₪${cleanMoney(freeAbove - itemsTotal)} לקבל את המשלוח בחינם.
      </div>
    `;
  }

  document.getElementById("title").innerText = title;
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      ${infoHtml}
      ${buildRecommendationsForTargetHtml(target)}
      ${mode === "freePaid" ? `<button class="confirmBtn" onclick="continueToCheckoutDetails()">אני רוצה משלוח בתשלום</button>` : ""}
      <button class="optionBtn" onclick="returnToMenuFromCheckout()">חזרה לתפריט</button>
    </div>
  `;
}

function buildRecommendationsForTargetHtml(target){
  const itemsTotal = getCartItemsTotal();
  const needed = Math.max(1, target - itemsTotal);
  const products = getSimpleRecommendedProducts(needed);

  if(!products.length){
    return `
      <div class="recommendBox">
        <div class="recommendTitle">אפשר להוסיף מוצר קטן נוסף מהתפריט כדי לסגור את ההזמנה.</div>
      </div>
    `;
  }

  return `
    <div class="recommendBox">
      <div class="recommendTitle">מוצרים שיכולים לעזור לסגור את ההזמנה:</div>
      <div class="recommendItems">
        ${products.map(item => `<button class="recommendBtn" onclick="addRecommendedProduct('${escapeJs(item.ItemNo)}')">${escapeHtml(item.ItemDesc)} - ₪${cleanMoney(item.ItemPrice)}</button>`).join("")}
      </div>
    </div>
  `;
}

function returnToMenuFromCheckout(){
  currentScreen = "menu";
  showCategoryMenu();
  showCartAreas();
  document.getElementById("title").innerText = "בחר קטגוריה";
  document.getElementById("items").className = "grid";
  document.getElementById("items").innerHTML = "";
}

function continueToCheckoutDetails(){
  currentScreen = "checkout_details";
  hideCategoryMenu();
  hideCartAreas();
  checkoutType = orderMode;
  paymentMethod = "";
  savedCheckout = {};

  document.getElementById("title").innerText = orderMode === "delivery" ? "פרטי לקוח למשלוח" : "פרטי איסוף עצמי";
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>${orderMode === "delivery" ? "פרטי לקוח למשלוח" : "פרטי לקוח לאיסוף עצמי"}</h2>

      ${orderMode === "delivery" ? `<div class="infoBox"><b>אזור משלוח:</b> ${escapeHtml(selectedDeliveryArea?.["שם"] || "")}<br><b>עלות משלוח:</b> ${getDeliveryFinalPrice() > 0 ? "₪" + cleanMoney(getDeliveryFinalPrice()) : "חינם"}</div>` : ""}

      <div class="formRow">
        <label>שם</label>
        <input id="clientName" type="text">
      </div>

      <div class="formRow">
        <label>מספר טלפון</label>
        <input id="phone" type="tel">
      </div>

      <div class="formRow">
        <label>הערה להזמנה</label>
        <textarea id="remark"></textarea>
      </div>

      <button class="confirmBtn" onclick="openPaymentStep()">המשך</button>
    </div>
  `;

  loadLastCustomer();
}

function openPaymentStep(){
  const clientName = document.getElementById("clientName")?.value.trim() || "";
  const phone = document.getElementById("phone")?.value.trim() || "";

  if(!clientName){
    showMessage("נא להזין שם");
    return;
  }

  if(!phone){
    showMessage("נא להזין מספר טלפון");
    return;
  }

  savedCheckout = {
    clientName,
    phone,
    remark: document.getElementById("remark")?.value.trim() || ""
  };

  currentScreen = "checkout_payment";
  hideCategoryMenu();
  document.getElementById("title").innerText = "אמצעי תשלום";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>בחר אמצעי תשלום</h2>

      <button class="optionBtn" id="cashPayBtn" onclick="choosePay('cash')">
        ${checkoutType === "delivery" ? "מזומן אצל השליח" : "מזומן בדלפק"}
      </button>

      <button class="optionBtn" id="creditPayBtn" onclick="choosePay('credit')">אשראי</button>

      <div id="paymentMethodText" class="freeText"></div>

      <button class="confirmBtn" onclick="submitOrder()">אישור</button>
    </div>
  `;
}

function choosePay(method){
  const cashBtn = document.getElementById("cashPayBtn");
  const creditBtn = document.getElementById("creditPayBtn");

  if(cashBtn) cashBtn.classList.remove("on");
  if(creditBtn) creditBtn.classList.remove("on");

  if(method === "credit"){
    paymentMethod = "credit";
    if(creditBtn) creditBtn.classList.add("on");
    document.getElementById("paymentMethodText").innerText = "נבחר: אשראי";
  }else{
    paymentMethod = checkoutType === "delivery" ? "cash_delivery" : "cash_counter";
    if(cashBtn) cashBtn.classList.add("on");
    document.getElementById("paymentMethodText").innerText = "נבחר: מזומן";
  }
}

function loadLastCustomer(){
  const lastPhone = localStorage.getItem("hataboon_last_phone") || "";
  const lastName = localStorage.getItem("hataboon_last_name") || "";

  const phoneEl = document.getElementById("phone");
  const nameEl = document.getElementById("clientName");

  if(phoneEl && !phoneEl.value) phoneEl.value = lastPhone;
  if(nameEl && !nameEl.value) nameEl.value = lastName;
}

function saveCustomerMemory(name, phone){
  const cleanPhone = normalizePhone(phone);

  if(name) localStorage.setItem("hataboon_last_name", name);
  if(cleanPhone) localStorage.setItem("hataboon_last_phone", cleanPhone);
}

async function submitOrder(){
  if(!paymentMethod){
    showMessage("נא לבחור אמצעי תשלום");
    return;
  }

  const s = savedCheckout || {};

  saveCustomerMemory(s.clientName, s.phone);

  const address = checkoutType === "delivery" ? buildDeliveryAddressText() : "";
  const isCredit = paymentMethod === "credit";
  const deliveryItem = buildDeliveryItem();
  const orderItems = deliveryItem ? [...cart, deliveryItem] : [...cart];

  const payload = {
    clientName: s.clientName,
    phone: normalizePhone(s.phone),
    address,
    area: checkoutType === "delivery" ? (selectedDeliveryArea?.["אזור חלוקה"] || "משלוח") : "איסוף עצמי",
    remark: s.remark,
    items: orderItems,
    total: getCartTotal(),
    paymentMethod,
    paymentMethodText: getPaymentMethodText(paymentMethod),
    orderStatus: isCredit ? "pending" : "approved",
    paymentSource: "new_order_system",
    delivery: checkoutType === "delivery" ? {
      type: "delivery",
      category: selectedDeliveryCategory,
      areaId: selectedDeliveryArea?.ID || "",
      areaName: selectedDeliveryArea?.["שם"] || "",
      areaType: selectedDeliveryArea?.["סוג"] || "",
      zone: selectedDeliveryArea?.["אזור חלוקה"] || "",
      minOrder: getDeliveryMinOrder(),
      deliveryPrice: getDeliveryBasePrice(),
      deliveryFinalPrice: getDeliveryFinalPrice(),
      freeAbove: getDeliveryFreeAbove(),
      eta: selectedDeliveryArea?.["צפי למשלוח בדקות"] || "",
      needFullAddress: selectedDeliveryArea?.["כתובת מלאה"] || "",
      addressDetails: deliveryAddressDetails || {}
    } : null
  };

  showLoading();

  try{
    const res = await fetch(ORDER_API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });

    const raw = await res.text();

    let result;
    try{
      result = JSON.parse(raw);
    }catch(parseErr){
      throw new Error("השרת החזיר תשובה לא תקינה: " + raw.slice(0, 250));
    }

    if(!res.ok || !result.ok){
      throw new Error(result.error || result.details || "שגיאה לא ידועה מהשרת");
    }

    if(isCredit){
      const paymentUrl = result.paymentUrl || result.url || result.sessionUrl;

      if(!paymentUrl){
        throw new Error("לא התקבל קישור סליקה מהשרת");
      }

      window.location.href = paymentUrl;
      return;
    }

    hideLoading();
    showOrderSuccess(result.orderNo || result.orderId || "");
  }catch(err){
    hideLoading();
    console.error("submitOrder error:", err);
    showMessage("שגיאה בשליחת ההזמנה: " + err.message);
  }
}

function getPaymentMethodText(method){
  if(method === "cash_counter") return "מזומן בדלפק";
  if(method === "cash_delivery") return "מזומן אצל השליח";
  if(method === "credit") return "אשראי";
  return "";
}

function normalizePhone(phone){
  return String(phone || "").replace(/[^\d]/g,"");
}

function showOrderSuccess(orderNo){
  currentScreen = "success";
  hideCartAreas();

  document.getElementById("title").innerText = "ההזמנה נשלחה";
  document.getElementById("items").className = "";
  document.getElementById("items").innerHTML = `
    <div class="panel">
      <h2>ההזמנה נשלחה בהצלחה</h2>
      <h3>מספר הזמנה: ${orderNo}</h3>
      <button class="confirmBtn" onclick="resetAfterOrder()">אישור</button>
    </div>
  `;
}

function resetAfterOrder(){
  currentScreen = "menu";
  cart = [];
  renderCart();

  currentCategory = null;
  parentId = -1;
  stack = [];
  currentItem = null;
  tempExtras = [];
  tempCombos = [];
  checkoutType = "";
  paymentMethod = "";
  savedCheckout = {};
  orderMode = "";
  selectedDeliveryCategory = "";
  selectedDeliveryArea = null;
  deliveryAddressDetails = {};

  renderStartChoice();
}

function cleanMoney(n){
  n = Number(n || 0);
  return n.toFixed(2).replace(".00","");
}

function goBack(){
  if(currentScreen === "start"){
    return;
  }

  if(currentScreen === "delivery_categories"){
    renderStartChoice();
    return;
  }

  if(currentScreen === "delivery_areas"){
    renderDeliveryCategories();
    return;
  }

  if(currentScreen === "delivery_info" || currentScreen === "delivery_blocked"){
    renderDeliveryAreas();
    return;
  }

  if(currentScreen === "delivery_address"){
    renderDeliveryAreaInfo();
    return;
  }

  if(currentScreen === "checkout_upsell"){
    returnToMenuFromCheckout();
    return;
  }

  if(currentScreen === "checkout_details" || currentScreen === "checkout_payment"){
    currentScreen = "menu";
    showCategoryMenu();
    showCartAreas();
    document.getElementById("title").innerText = "בחר קטגוריה";
    document.getElementById("items").className = "grid";
    document.getElementById("items").innerHTML = "";
    return;
  }

  currentScreen = "menu";
  showCategoryMenu();
  showCartAreas();

  if(stack.length === 0){
    parentId = -1;
    document.getElementById("title").innerText = "בחר קטגוריה";
    document.getElementById("items").className = "grid";
    document.getElementById("items").innerHTML = "";
    return;
  }

  const last = stack.pop();
  parentId = last.parentId;
  openLevel(last.title);
}

start();
</script>
