<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הטאבון 🍕</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f4f4;color:#111}
header{background:#111;color:#fff;text-align:center;padding:18px;font-size:26px;font-weight:bold;position:sticky;top:0;z-index:100}

.topBar{background:white;padding:12px;display:flex;gap:10px;align-items:center;justify-content:center;border-bottom:1px solid #ddd;position:sticky;top:65px;z-index:90}
.total{font-size:22px;font-weight:bold;color:#159947}
.checkoutBtn{background:#159947;color:white;border:0;border-radius:10px;padding:12px 24px;font-size:18px;cursor:pointer}

.wrapper{display:flex;min-height:calc(100vh - 130px)}
.sidebar{width:230px;background:#e9e9e9;padding:12px;overflow:auto}
.sidebar button{width:100%;background:white;border:1px solid #ccc;border-radius:10px;padding:14px;margin-bottom:10px;font-size:18px;font-weight:bold;cursor:pointer}
.sidebar button.active{background:#159947;color:white}

.main{flex:1;padding:20px}
.title{font-size:30px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}

.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:22px}
.price{font-size:20px;color:#159947;font-weight:bold}
.addBtn{background:#159947;color:white;border:0;border-radius:10px;padding:12px;font-size:18px;cursor:pointer;margin-top:auto}

.cart{background:white;border-radius:16px;padding:18px;margin-top:25px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cart h2{margin-top:0}
.cartItem{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;gap:10px}
.removeBtn{background:#d71920;color:white;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}

.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:700px}
.formRow{margin-bottom:14px}
.formRow label{display:block;font-weight:bold;margin-bottom:6px}
.formRow input,.formRow textarea,.formRow select{width:100%;padding:13px;font-size:17px;border:1px solid #ccc;border-radius:10px}
.payOptions{display:flex;gap:10px;flex-wrap:wrap}
.payOption{flex:1;min-width:160px;padding:16px;background:#fff;border:2px solid #ccc;border-radius:12px;font-size:18px;cursor:pointer}
.payOption.active{border-color:#159947;background:#e9fff0}

.loading{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;z-index:999;font-size:24px;font-weight:bold}
.hidden{display:none}

@media(max-width:800px){
  .wrapper{flex-direction:column}
  .sidebar{width:100%;display:flex;gap:8px;overflow-x:auto}
  .sidebar button{min-width:150px}
  .topBar{top:64px;flex-direction:column}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="loading" id="loading">טוען...</div>

<header>🍕 הטאבון</header>

<div class="topBar">
  <div class="total" id="topTotal">סה"כ: ₪0</div>
  <button class="checkoutBtn" onclick="openCheckout()">מעבר לתשלום</button>
</div>

<div class="wrapper">
  <aside class="sidebar" id="categories"></aside>

  <main class="main">
    <h1 class="title" id="pageTitle">בחר קטגוריה</h1>
    <div id="content" class="grid"></div>

    <div class="cart" id="cartBox">
      <h2>הסל שלך</h2>
      <div id="cartItems">הסל ריק</div>
      <h2 id="cartTotal">סה"כ: ₪0</h2>
    </div>
  </main>
</div>

<script>
const BASE_URL = window.location.origin;

let data = {categories:[],items:[]};
let cart = [];
let selectedPayment = "";

function showLoading(){document.getElementById("loading").style.display="flex"}
function hideLoading(){document.getElementById("loading").style.display="none"}

async function loadMenu(){
  showLoading();
  try{
    const res = await fetch(BASE_URL + "/api/menu");
    data = await res.json();

    if(!data.ok){
      throw new Error(data.error || "שגיאה בטעינת התפריט");
    }

    data.categories = data.categories || [];
    data.items = data.items || [];

    renderCategories();
    const first = data.categories.find(c => String(c["אתר/אפליקציה"]).trim() === "כן");
    if(first) openCategory(first["מספר קטגורייה"], first["שם"]);
  }catch(err){
    document.getElementById("content").className = "";
    document.getElementById("content").innerHTML = "<div class='panel'>שגיאה בטעינת התפריט<br>" + err.message + "</div>";
  }
  hideLoading();
}

function renderCategories(){
  const box = document.getElementById("categories");
  box.innerHTML = "";

  data.categories
    .filter(c => String(c["אתר/אפליקציה"]).trim() === "כן")
    .forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat["שם"];
      btn.onclick = () => openCategory(cat["מספר קטגורייה"], cat["שם"], btn);
      box.appendChild(btn);
    });
}

function openCategory(catId, name, clickedBtn){
  document.getElementById("pageTitle").textContent = name;
  document.getElementById("content").className = "grid";

  document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));
  if(clickedBtn) clickedBtn.classList.add("active");

  const content = document.getElementById("content");
  content.innerHTML = "";

  const items = data.items.filter(item =>
    Number(item.ItemCategory) === Number(catId) &&
    Number(item.IsActive) === 0 &&
    Number(item.IsCategory) === 0 &&
    Number(item.ItemPrice) > 0
  );

  if(items.length === 0){
    content.innerHTML = "<div class='panel'>אין מוצרים בקטגוריה הזו</div>";
    return;
  }

  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const name = item.ItemDesc || "";
    const price = Number(item.ItemPrice || 0);

    card.innerHTML = `
      <h3>${escapeHtml(name)}</h3>
      <div class="price">₪${cleanMoney(price)}</div>
      <button class="addBtn">הוסף לסל</button>
    `;

    card.querySelector("button").onclick = () => addToCart(item);
    content.appendChild(card);
  });
}

function addToCart(item){
  cart.push({
    itemNo:item.ItemNo,
    itemDesc:item.ItemDesc,
    itemPrice:Number(item.ItemPrice || 0),
    qty:1,
    total:Number(item.ItemPrice || 0),
    extras:[]
  });
  renderCart();
}

function removeFromCart(index){
  cart.splice(index,1);
  renderCart();
}

function getTotal(){
  return cart.reduce((s,i)=>s+Number(i.total || 0),0);
}

function renderCart(){
  const itemsBox = document.getElementById("cartItems");
  const total = getTotal();

  document.getElementById("topTotal").textContent = "סה\"כ: ₪" + cleanMoney(total);
  document.getElementById("cartTotal").textContent = "סה\"כ: ₪" + cleanMoney(total);

  if(cart.length === 0){
    itemsBox.innerHTML = "הסל ריק";
    return;
  }

  itemsBox.innerHTML = "";
  cart.forEach((item,index)=>{
    const row = document.createElement("div");
    row.className = "cartItem";
    row.innerHTML = `
      <div><b>${escapeHtml(item.itemDesc)}</b><br>₪${cleanMoney(item.total)}</div>
      <button class="removeBtn">מחק</button>
    `;
    row.querySelector("button").onclick = () => removeFromCart(index);
    itemsBox.appendChild(row);
  });
}

function openCheckout(){
  if(cart.length === 0){
    alert("הסל ריק");
    return;
  }

  document.getElementById("pageTitle").textContent = "פרטי הזמנה";
  document.getElementById("content").className = "";
  document.getElementById("content").innerHTML = `
    <div class="panel">
      <div class="formRow">
        <label>שם</label>
        <input id="clientName" type="text">
      </div>

      <div class="formRow">
        <label>טלפון</label>
        <input id="phone" type="tel">
      </div>

      <div class="formRow">
        <label>איסוף / משלוח</label>
        <select id="orderType" onchange="toggleAddress()">
          <option value="pickup">איסוף עצמי</option>
          <option value="delivery">משלוח</option>
        </select>
      </div>

      <div id="addressBox" class="hidden">
        <div class="formRow">
          <label>כתובת למשלוח</label>
          <input id="address" type="text">
        </div>
      </div>

      <div class="formRow">
        <label>הערה להזמנה</label>
        <textarea id="remark"></textarea>
      </div>

      <h2>אמצעי תשלום</h2>
      <div class="payOptions">
        <button class="payOption" onclick="choosePayment('cash_counter', this)">מזומן בדלפק</button>
        <button class="payOption" onclick="choosePayment('cash_delivery', this)">מזומן לשליח</button>
        <button class="payOption" onclick="choosePayment('credit', this)">אשראי</button>
      </div>

      <button class="checkoutBtn" style="width:100%;margin-top:20px" onclick="submitOrder()">אישור הזמנה</button>
    </div>
  `;
}

function toggleAddress(){
  const type = document.getElementById("orderType").value;
  document.getElementById("addressBox").classList.toggle("hidden", type !== "delivery");
}

function choosePayment(method, btn){
  selectedPayment = method;
  document.querySelectorAll(".payOption").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

async function submitOrder(){
  const clientName = document.getElementById("clientName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const orderType = document.getElementById("orderType").value;
  const address = document.getElementById("address")?.value.trim() || "";
  const remark = document.getElementById("remark").value.trim();

  if(!clientName){alert("נא להזין שם");return}
  if(!phone){alert("נא להזין טלפון");return}
  if(orderType === "delivery" && !address){alert("נא להזין כתובת למשלוח");return}
  if(!selectedPayment){alert("נא לבחור אמצעי תשלום");return}

  const payload = {
    clientName,
    phone,
    address,
    area: orderType === "delivery" ? "משלוח" : "איסוף עצמי",
    remark,
    items: cart,
    total: getTotal(),
    paymentMethod: selectedPayment,
    paymentMethodText: paymentText(selectedPayment),
    orderStatus: selectedPayment === "credit" ? "pending" : "approved",
    paymentSource: "new_order_system"
  };

  showLoading();

  try{
    const res = await fetch(BASE_URL + "/api/order", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const result = await res.json();

    if(!result.ok){
      throw new Error(result.error || "שגיאה בשליחת ההזמנה");
    }

    if(selectedPayment === "credit"){
      if(!result.paymentUrl){
        throw new Error("לא התקבל קישור תשלום");
      }
      window.location.href = result.paymentUrl;
      return;
    }

    hideLoading();
    showSuccess(result.orderNo || "");
  }catch(err){
    hideLoading();
    alert("שגיאה: " + err.message);
  }
}

function showSuccess(orderNo){
  cart = [];
  renderCart();
  document.getElementById("pageTitle").textContent = "ההזמנה נשלחה";
  document.getElementById("content").className = "";
  document.getElementById("content").innerHTML = `
    <div class="panel">
      <h2>ההזמנה התקבלה בהצלחה ✅</h2>
      <h3>מספר הזמנה: ${escapeHtml(orderNo)}</h3>
      <button class="checkoutBtn" onclick="location.reload()">חזרה לתפריט</button>
    </div>
  `;
}

function paymentText(method){
  if(method === "cash_counter") return "מזומן בדלפק";
  if(method === "cash_delivery") return "מזומן לשליח";
  if(method === "credit") return "אשראי";
  return "";
}

function cleanMoney(n){
  n = Number(n || 0);
  return n.toFixed(2).replace(".00","");
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadMenu();
</script>

</body>
</html>
