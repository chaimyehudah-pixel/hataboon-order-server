<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הטאבון 🍕</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px; }
    h1 { text-align:center; }
    .category { margin-top:30px; }
    .item {
      background:#fff;
      padding:10px;
      margin:5px 0;
      border-radius:8px;
      display:flex;
      justify-content:space-between;
    }
    button {
      background:green;
      color:#fff;
      border:none;
      padding:5px 10px;
      border-radius:5px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<h1>הטאבון 🍕</h1>

<div id="menu"></div>

<script>
const BASE_URL = "https://compassionate-cat-production.up.railway.app";

let cart = [];

fetch(BASE_URL + "/api/menu")
  .then(res => res.json())
  .then(data => {
    const menuDiv = document.getElementById("menu");

    data.categories.forEach(cat => {
      if (cat["אתר/אפליקציה"] !== "כן") return;

      const catDiv = document.createElement("div");
      catDiv.className = "category";
      catDiv.innerHTML = `<h2>${cat["שם"]}</h2>`;

      data.items
        .filter(item => item.ItemCategory == cat["מספר קטגורייה"] && item.ItemPrice > 0)
        .forEach(item => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";

          itemDiv.innerHTML = `
            <span>${item.ItemDesc} - ₪${item.ItemPrice}</span>
            <button onclick="addToCart('${item.ItemDesc}', ${item.ItemPrice})">הוסף</button>
          `;

          catDiv.appendChild(itemDiv);
        });

      menuDiv.appendChild(catDiv);
    });
  });

function addToCart(name, price) {
  cart.push({ name, price });
  alert(name + " נוסף לסל");
}
</script>

</body>
</html>
